<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" width="100%" height="auto" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="2" y="2" width="996" height="411" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="28" y="34" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">TASK LIFECYCLE &amp; ATOMIC LUA TRANSITIONS</text>

  <!-- Producer / Enqueue node -->
  <text x="68" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">enqueue</text>
  <text x="68" y="177" text-anchor="middle" font-size="10" fill="#64748b">idem:&lt;key&gt;</text>
  <circle cx="68" cy="195" r="6" fill="#0f172a"/>

  <!-- Enqueue -> Ready (delay = 0) -->
  <path d="M 74 195 L 327 195" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="200" y="185" text-anchor="middle" font-size="11" fill="#475569">delay = 0 (LPUSH)</text>

  <!-- Enqueue -> Delayed (delay > 0) -->
  <path d="M 68 201 L 68 305 L 127 305" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="78" y="258" text-anchor="start" font-size="11" fill="#475569">delay &gt; 0</text>

  <!-- STATE: DELAYED -->
  <rect x="135" y="275" width="150" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">queue:delayed</text>
  <text x="210" y="319" text-anchor="middle" font-size="10" fill="#b45309">ZSET (score = run_at)</text>

  <!-- Delayed -> Ready (promote) -->
  <path d="M 285 305 L 370 305 L 370 233" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="326" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">promote</text>
  <text x="360" y="264" text-anchor="end" font-size="10" fill="#64748b">LPUSH (back)</text>

  <!-- STATE: READY -->
  <rect x="335" y="165" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">queue:ready</text>
  <text x="410" y="209" text-anchor="middle" font-size="10" fill="#1d4ed8">LIST (RPOP front)</text>

  <!-- Ready -> Leased (lease) -->
  <path d="M 485 195 L 562 195" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <text x="524" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">lease</text>
  <text x="524" y="213" text-anchor="middle" font-size="10" fill="#6366f1">+fencing_token</text>

  <!-- STATE: LEASED -->
  <rect x="570" y="165" width="150" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="645" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">queue:leased</text>
  <text x="645" y="209" text-anchor="middle" font-size="10" fill="#4338ca">ZSET (score = exp)</text>

  <!-- Heartbeat loop on Leased -->
  <path d="M 625 225 C 620 260, 670 260, 665 228" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-indigo)"/>
  <text x="645" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">heartbeat (extend)</text>

  <!-- Leased -> Ready (reap / release) -->
  <path d="M 645 165 L 645 98 L 422 98 L 422 157" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="534" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">reap (expired) / release (SIGTERM)</text>
  <text x="534" y="114" text-anchor="middle" font-size="10" fill="#64748b">RPUSH (back to front of line)</text>

  <!-- Leased -> Delayed (fail with retries left) -->
  <path d="M 588 225 L 588 375 L 210 375 L 210 343" fill="none" stroke="#475569" stroke-width="1.75" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="400" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">fail (retries left: exponential backoff + jitter)</text>

  <!-- Leased -> Completed (ack) -->
  <path d="M 720 180 L 755 180 L 755 120 L 832 120" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="794" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">ack</text>

  <!-- STATE: COMPLETED -->
  <rect x="840" y="92" width="115" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="897" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">completed</text>
  <text x="897" y="135" text-anchor="middle" font-size="10" fill="#047857">task:&lt;id&gt;</text>

  <!-- Leased -> DLQ (out of retries) -->
  <path d="M 720 210 L 755 210 L 755 268 L 832 268" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="794" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#e11d48">fail / reap</text>
  <text x="794" y="284" text-anchor="middle" font-size="9" fill="#be123c">(max_retries)</text>

  <!-- STATE: DLQ -->
  <rect x="840" y="240" width="115" height="56" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="897" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">queue:dlq</text>
  <text x="897" y="283" text-anchor="middle" font-size="10" fill="#be123c">state = dead</text>

  <!-- DLQ -> Ready (retry_dead, routed around the outside right edge so it never crosses completed) -->
  <path d="M 955 268 L 976 268 L 976 44 L 388 44 L 388 157" fill="none" stroke="#64748b" stroke-width="1.35" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="682" y="35" text-anchor="middle" font-size="10" fill="#475569">retry_dead (manual reset retries = 0, LPUSH)</text>
</svg>
